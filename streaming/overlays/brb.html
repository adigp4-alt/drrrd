<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Be Right Back</title>
<!--
  Full-screen "be right back" card with an away timer that counts *up*, so
  chat can see how long you have actually been gone.

  Options: title, subtitle, handle, accent, accent2, timer=off
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --accent: #7c5cff;
    --accent2: #22d3ee;
    --ink: #f4f4f7;
    --dim: rgba(244, 244, 247, 0.55);
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #07070c;
    color: var(--ink);
    font-family: "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  }

  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0.42;
  }
  .blob.one {
    width: 44vw; height: 44vw;
    background: var(--accent2);
    top: -10vw; right: -10vw;
    animation: drift-a 25s ease-in-out infinite alternate;
  }
  .blob.two {
    width: 38vw; height: 38vw;
    background: var(--accent);
    bottom: -12vw; left: -8vw;
    animation: drift-b 31s ease-in-out infinite alternate;
  }
  @keyframes drift-a {
    from { transform: translate3d(0, 0, 0) scale(1); }
    to   { transform: translate3d(-6vw, 7vw, 0) scale(1.12); }
  }
  @keyframes drift-b {
    from { transform: translate3d(0, 0, 0) scale(1.08); }
    to   { transform: translate3d(6vw, -4vw, 0) scale(0.94); }
  }

  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.8) 100%);
  }

  .stage {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 2.4vh;
  }

  /* Three dots that fill in one after another - a "hang on" gesture that
     reads instantly even at low bitrate. */
  .dots { display: flex; gap: 1.1vw; margin-bottom: 1vh; }
  .dots span {
    width: 1.1vw; height: 1.1vw;
    border-radius: 50%;
    background: var(--accent2);
    opacity: 0.25;
    animation: hop 1.4s ease-in-out infinite;
  }
  .dots span:nth-child(2) { animation-delay: 0.18s; }
  .dots span:nth-child(3) { animation-delay: 0.36s; }
  @keyframes hop {
    0%, 70%, 100% { opacity: 0.25; transform: translateY(0); }
    35%           { opacity: 1;    transform: translateY(-0.9vh); }
  }

  h1 {
    font-size: 8.4vw;
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 0.92;
    background: linear-gradient(100deg, var(--ink) 25%, var(--accent2) 60%, var(--accent) 95%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle {
    font-size: 1.7vw;
    color: var(--dim);
    max-width: 44ch;
    line-height: 1.5;
  }

  .away {
    margin-top: 1.2vh;
    font-size: 1.25vw;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
  }
  .away b { color: var(--ink); font-weight: 600; }

  .handle {
    position: absolute;
    bottom: 4.5vh;
    font-size: 1.5vw;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--dim);
  }

  .bar {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 6px;
    background: linear-gradient(90deg, var(--accent2), var(--accent), var(--accent2));
    background-size: 200% 100%;
    animation: slide 8s linear infinite;
  }
  @keyframes slide {
    from { background-position: 0% 0; }
    to   { background-position: 200% 0; }
  }
</style>
</head>
<body>
  <div class="blob one"></div>
  <div class="blob two"></div>
  <div class="vignette"></div>

  <div class="stage">
    <div class="dots"><span></span><span></span><span></span></div>
    <h1 id="title">Be Right Back</h1>
    <p class="subtitle" id="subtitle">Stretching my legs. Keep the chat warm.</p>
    <div class="away" id="away">Away for <b id="elapsed">0:00</b></div>
    <div class="handle" id="handle"></div>
  </div>
  <div class="bar"></div>

<script>
(function () {
  var params = new URLSearchParams(location.search);

  function set(id, value) {
    if (value) { document.getElementById(id).textContent = value; }
  }

  if (params.get('accent')) {
    document.documentElement.style.setProperty('--accent', params.get('accent'));
  }
  if (params.get('accent2')) {
    document.documentElement.style.setProperty('--accent2', params.get('accent2'));
  }

  set('title', params.get('title'));
  set('subtitle', params.get('subtitle'));
  set('handle', params.get('handle'));

  if (params.get('timer') === 'off') {
    document.getElementById('away').style.display = 'none';
    return;
  }

  // The browser source is set to refresh when it becomes active, so this
  // starts from zero every time you cut to the BRB scene.
  var startedAt = Date.now();
  var elapsed = document.getElementById('elapsed');

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  setInterval(function () {
    var secs = Math.floor((Date.now() - startedAt) / 1000);
    var m = Math.floor(secs / 60);
    var s = secs % 60;
    elapsed.textContent = m + ':' + pad(s);
  }, 500);
})();
</script>
</body>
</html>
